<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlaneTilt sound demo</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; max-width: 46rem; background: #14161b; color: #e8e8ea; }
  button { font: inherit; padding: 8px 14px; margin: 4px 6px 4px 0; border-radius: 8px; border: 1px solid #555; background: #262a33; color: inherit; cursor: pointer; }
  ol { padding-left: 1.2rem; }
</style>
</head>
<body>
<h1>PlaneTilt sound demo</h1>
<p>Renders the game's own sound engine (soundEngine.js) through a scripted tour, so a change can be heard without a phone. <code>node scripts/renderSoundDemo.js</code> saves it as a WAV.</p>
<div id="buttons"></div>
<ol id="list"></ol>
<script type="module">
import { createSoundEngine } from '../soundEngine.js';
import { SURFACES } from '../soundModel.js';

const SR = 44100;
const FRAME = 1 / 60;

// Drive the roll like the game does: one update per frame, at speeds(t).
function rollFor(e, { from, to, speed, surface, iceAt, radius = 0.3, pan = (t) => 0 }) {
    for (let t = from; t < to; t += FRAME) {
        const onIce = iceAt ? iceAt(t) : false;
        e.updateRoll({ speed: speed(t), radius, onFloor: true, onIce, pan: pan(t), dt: FRAME, t });
    }
    e.silenceRoll(to);
}
const ramp = (t0, t1, v0, v1) => (t) => v0 + (v1 - v0) * Math.max(0, Math.min(1, (t - t0) / (t1 - t0)));
const hill = (t0, t1, peak) => (t) => { const k = (t - t0) / (t1 - t0); return k <= 0 || k >= 1 ? 0 : peak * Math.sin(Math.PI * k); };

// Each scene: its own context (its own room), concatenated afterwards.
export const SCENES = [
    {
        title: 'Workshop: a Classic marble rolls up to speed on the wooden board, slows, then three wall hits (soft, medium, hard)',
        seconds: 7.5, theme: 'workshop', marble: 'classic', room: [0.7, 0.14], ambience: ['room', 0.035],
        play(e) {
            rollFor(e, { from: 0.1, to: 4.6, speed: hill(0.1, 4.6, 5.8), surface: SURFACES.workshop, pan: (t) => -0.5 + (t / 4.6) });
            e.impact('wood', 0.6, { t: 5.0, pan: -0.3 }); e.impact('wood', 1.8, { t: 5.7, pan: 0.1 }); e.impact('wood', 4.0, { t: 6.4, pan: 0.4 });
        }
    },
    {
        title: 'Forest: rolling over earth and leaves, then a knock off a log wall',
        seconds: 5, theme: 'forest', marble: 'classic', room: [0.5, 0.06], ambience: ['leaves', 0.05],
        play(e) {
            rollFor(e, { from: 0.2, to: 3.8, speed: hill(0.2, 3.8, 4.5), surface: SURFACES.forest });
            e.impact('log', 2.2, { t: 4.0 }); e.chirp({ t: 1.4, pan: 0.6 });
        }
    },
    {
        title: 'Glacier: snow, then onto ICE at 2 s (the grip goes: a glassy hiss), then a hit on an ice wall; an icicle creaks and shatters',
        seconds: 7, theme: 'glacier', marble: 'glass', room: [1.1, 0.12], ambience: ['wind', 0.07],
        play(e) {
            rollFor(e, { from: 0.2, to: 4.2, speed: ramp(0.2, 2.0, 0.5, 4.8), surface: SURFACES.snowfield, iceAt: (t) => t > 2.0 });
            e.impact('ice', 3.0, { t: 4.25 });
            for (let i = 0; i < 6; i++) e.creak({ t: 4.8 + i * 0.12, pan: 0.5 });
            e.shatter({ t: 5.6, pan: 0.5 });
        }
    },
    {
        title: 'Magma Works: rolling on basalt, a seam sizzles up and FLARES, lava bubbles, a marble burned',
        seconds: 7, theme: 'lava', marble: 'classic', room: [1.3, 0.14], ambience: ['lava', 0.07],
        play(e) {
            rollFor(e, { from: 0.2, to: 2.6, speed: hill(0.2, 2.6, 4.2), surface: SURFACES.lava });
            const s = e.loop('sizzle');
            for (let t = 2.6; t < 3.6; t += 0.05) s.set(0.2 * (0.25 + 0.75 * (t - 2.6)), -0.3, (t - 2.6), t);
            e.roar({ t: 3.6, pan: -0.3 }); s.set(0.02, -0.3, 0, 4.2);
            e.bubble({ t: 4.6, pan: 0.5 }); e.bubble({ t: 5.0, pan: -0.6 });
            e.burn({ t: 5.5 });
            s.stop(6.8);
        }
    },
    {
        title: 'Toy Box: a plastic board, a pinball bumper kick, a spring winding up (ratchet) and firing, a hit on a plastic brick',
        seconds: 6.5, theme: 'toybox', marble: 'classic', room: [0.6, 0.1], ambience: ['room', 0.03],
        play(e) {
            rollFor(e, { from: 0.2, to: 2.0, speed: ramp(0.2, 2.0, 1, 4.6), surface: SURFACES.toybox });
            e.bumper({ t: 2.0, pan: 0.3 });
            for (let i = 0; i < 10; i++) e.ratchet({ t: 2.8 + i * 0.09, pan: -0.4 });
            e.spring({ t: 3.75, pan: -0.4 });
            rollFor(e, { from: 3.8, to: 5.2, speed: ramp(3.8, 5.2, 4.4, 0.5), surface: SURFACES.toybox });
            e.impact('plastic', 2.5, { t: 5.3 });
        }
    },
    {
        title: 'Foundry: a STEEL marble on tread plate (the ticks are the raised bumps), a press building pressure and SLAMMING, hydraulics venting, a rail sparking, a shock',
        seconds: 9, theme: 'foundry', marble: 'steel', room: [1.9, 0.2], ambience: ['factory', 0.06],
        play(e) {
            rollFor(e, { from: 0.2, to: 3.0, speed: hill(0.2, 3.0, 5), surface: SURFACES.foundry });
            e.impact('steel', 2.4, { t: 3.1, pan: 0.2 });
            const h = e.loop('hydraulic');
            for (let t = 3.4; t < 4.3; t += 0.05) h.set(0.12 * (0.3 + 0.7 * (t - 3.4) / 0.9), 0.3, (t - 3.4) / 0.9, t);
            h.set(0, 0.3, 0, 4.35);
            e.slam({ t: 4.4, pan: 0.3 });
            e.vent({ t: 5.4, pan: 0.3 });
            for (let i = 0; i < 9; i++) e.spark({ t: 6.2 + i * 0.1, pan: -0.5 });
            e.zap({ t: 7.3, pan: -0.5 });
            h.stop(8.8);
        }
    },
    {
        title: 'Rubber marble vs Classic on the same wood: a roll and a hit each (rubber is the damped one)',
        seconds: 6, theme: 'workshop', marble: 'rubber', room: [0.7, 0.14], ambience: ['room', 0.035],
        play(e) {
            rollFor(e, { from: 0.1, to: 2.2, speed: hill(0.1, 2.2, 4.6), surface: SURFACES.workshop });
            e.impact('wood', 3, { t: 2.4 });
            e.setMarble('classic');
            rollFor(e, { from: 3.1, to: 5.2, speed: hill(3.1, 5.2, 4.6), surface: SURFACES.workshop });
            e.impact('wood', 3, { t: 5.4 });
        }
    },
    {
        title: 'Moments: a coin, a power-up, a shield saving a fall, a geyser blast, a marble down a hole, and a clear (into the cup, then the bell)',
        seconds: 8.5, theme: 'workshop', marble: 'classic', room: [0.7, 0.14], ambience: ['room', 0.035],
        play(e) {
            e.coin({ t: 0.3 }); e.pickup({ t: 1.1 }); e.shield({ t: 2.0 });
            e.steam({ t: 3.0, pan: 0.4 });
            rollFor(e, { from: 4.0, to: 4.9, speed: ramp(4.0, 4.9, 1.5, 3), surface: SURFACES.workshop });
            e.holeDrop({ t: 4.9, wall: 'wood', speed: 3 });
            e.goal({ t: 6.6, wall: 'wood' });
        }
    }
];

async function renderScene(sc) {
    const ctx = new OfflineAudioContext(2, Math.ceil(sc.seconds * SR), SR);
    const e = createSoundEngine(ctx);
    e.setSurface(SURFACES[sc.theme]);
    e.setMarble(sc.marble);
    e.setRoom(sc.room[0], sc.room[1]);
    const amb = e.loop(sc.ambience[0]);
    amb.set(sc.ambience[1], 0, undefined, 0);
    sc.play(e);
    amb.stop(sc.seconds - 0.3);
    return ctx.startRendering();
}

// All scenes, 0.6 s apart, as one stereo buffer's channels.
export async function renderAll() {
    const gap = Math.floor(0.6 * SR);
    const parts = [];
    for (const sc of SCENES) parts.push(await renderScene(sc));
    const total = parts.reduce((n, b) => n + b.length + gap, 0);
    const L = new Float32Array(total), R = new Float32Array(total);
    let at = 0;
    const starts = [];
    for (const b of parts) {
        starts.push(at / SR);
        L.set(b.getChannelData(0), at); R.set(b.getChannelData(1), at);
        at += b.length + gap;
    }
    return { L, R, starts };
}

// 16-bit stereo WAV.
export function wav(L, R) {
    const n = L.length, buf = new ArrayBuffer(44 + n * 4), v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, SR, true);
    v.setUint32(28, SR * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 4, true);
    let o = 44;
    for (let i = 0; i < n; i++) {
        v.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 0x7fff, true); o += 2;
        v.setInt16(o, Math.max(-1, Math.min(1, R[i])) * 0x7fff, true); o += 2;
    }
    return new Uint8Array(buf);
}

window.__soundDemo = async () => {
    const { L, R, starts } = await renderAll();
    let peak = 0;
    for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
    const bytes = wav(L, R);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return { b64: btoa(bin), starts, titles: SCENES.map(s => s.title), peak, seconds: L.length / SR };
};

// In a browser: a button per scene, played live through the same engine.
const list = document.getElementById('list');
SCENES.forEach(sc => { const li = document.createElement('li'); li.textContent = sc.title; list.appendChild(li); });
const btn = document.createElement('button');
btn.textContent = 'Play the tour';
btn.onclick = async () => {
    const { L, R } = await renderAll();
    const ac = new AudioContext({ sampleRate: SR });
    const b = ac.createBuffer(2, L.length, SR);
    b.getChannelData(0).set(L); b.getChannelData(1).set(R);
    const s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start();
};
document.getElementById('buttons').appendChild(btn);
</script>
</body>
</html>
