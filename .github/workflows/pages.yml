# Publish the web game to GitHub Pages on every push to main.
#
# Pages serves only committed files, and node_modules is not committed, so the
# dev page (index.html's importmap) cannot load there. This builds the flat web
# bundle instead -- three and cannon-es inside game.js, no CrazyGames SDK --
# and deploys dist/web/. The Node test suite gates it: a level the verifier
# rejects never reaches the site, and neither does a server that fails its
# tests (server/).
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm test
      # The cloud save / leaderboard server, when the repo variable
      # PLANETILT_API_URL is set (Settings -> Secrets and variables ->
      # Actions -> Variables); unset, the site builds without one.
      - run: npm run build:web
        env:
          PLANETILT_API_URL: ${{ vars.PLANETILT_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
