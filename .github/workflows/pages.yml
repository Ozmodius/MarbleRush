# The game now lives at https://planetilt.com (a Render static site that
# builds from main, tests first: `npm ci && npm ci --prefix server && npm test
# && npm run build:web`, published from dist/web). This workflow still runs the
# Node suite on every push, and keeps the old GitHub Pages address alive as a
# redirect to planetilt.com (.github/pages-redirect/) so old links still land
# on the game. Turning Pages off entirely is repo Settings -> Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
